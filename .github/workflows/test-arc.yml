name: Test ARC Runner
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Test ARC
        run: |
          echo "🎉 Running on ARC self-hosted runner!"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"
          uname -a
          echo "✅ Success!"
